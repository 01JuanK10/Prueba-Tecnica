<div class="divisor">
    <div class="izquierda">
        <div class="card podcast-card" style="width: 12rem;">
            <img src="{{podcast.urlImagen}}" class="card-img-top" alt="Imagen de {{podcast.titulo}}">
            <div class="card-body">
                <hr>
                <h5>{{podcast.titulo}}</h5>
                <hr>
                <p>{{podcast.autor}}</p>
            </div>
        </div>
    </div>
    <div class="derecha">

        <div class="card episodes-count-card">
            <h2>Episodes: {{ cantidadEpisodios }}</h2>
        </div>

        <div class="card episodes-table-card">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Title</th>
                        <th scope="col">Date</th>
                        <th scope="col">Duration</th>
                    </tr>
                </thead>
                <tbody>
                    @for (episode of episodios; track episode.id) {
                        <tr>
                            <td><p id="titulo-episodio">{{ episode.titulo }}</p></td>
                            <td>{{ episode.fechaPublicacion | date:'d/M/yyyy' }}</td>
                            <td>{{ episode.duracion }}</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>

        <router-outlet></router-outlet>
    </div>

</div>
