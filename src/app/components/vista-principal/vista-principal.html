<div class="cuadricula">
    @for (item of PodcastList; track item.id) {
        <div class="card podcast-card" style="width: 12rem;" (click)="OnClickPodcast(item.id)">
            <div class="image-wrapper">
                <img src="{{ item.urlImagen }}"
                    alt="Imagen de {{ item.titulo }}">
            </div>
            <div class="card-body">
                <h5>{{item.titulo}}</h5>
                <p>{{item.autor}}</p>
            </div>
        </div>
    }
</div>
