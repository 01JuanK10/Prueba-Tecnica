<div id="div-filtro">
    <input id="input-filtro"type="text" (input)="filtrarPodcasts($event.target.value)">
    <div id="contador-podcast">
            <p>{{cantidadLista()}}</p>
    </div>
</div>

<div class="cuadricula">
    @for (item of podcastList(); track item.id) {
        <div class="card podcast-card" style="width: 12rem;" (click)="OnClickPodcast(item.id)">
            <div class="image-wrapper">
                <img src="{{ item.urlImagen }}"
                    alt="Imagen de {{ item.titulo }}">
            </div>
            <div class="card-body">
                <h5>{{item.titulo}}</h5>
                <p>{{item.autor}}</p>
            </div>
        </div>
    }
</div>
